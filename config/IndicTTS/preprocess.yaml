dataset: "IndicTTS"

path:
  corpus_path: "data/telugu_parquet/data"
  raw_path: "data/telugu_parquet/data"
  preprocessed_path: "preprocessed_data/IndicTTS"

preprocessing:
  val_size: 421
  text:
    text_cleaners: ["telugu_cleaners"]
    language: "te"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "frame_level"
    normalization: True
  energy:
    feature: "frame_level"
    normalization: True

