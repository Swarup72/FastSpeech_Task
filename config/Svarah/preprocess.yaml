dataset: "Svarah"

path:
  corpus_path: "data/svarah_train/corpus"
  raw_path: "data/svarah_train/corpus"
  preprocessed_path: "preprocessed_data/Svarah"

preprocessing:
  val_size: 664
  text:
    text_cleaners: ["english_cleaners"]
    language: "en"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "frame_level"
    normalization: True
  energy:
    feature: "frame_level"
    normalization: True

