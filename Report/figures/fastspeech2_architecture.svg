<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="vaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="vocGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="972" height="612" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="4" y="4" width="972" height="44" rx="10" fill="url(#hdrGrad)"/>
  <text x="490" y="31" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="0.4">FastSpeech 2 + Universal HiFi-GAN Architecture (Implemented in common/model/ &amp; original_fastspeech2/hifigan/)</text>

  <!-- COLUMN 1: TEXT FRONTEND & FFT ENCODER -->
  <rect x="24" y="64" width="250" height="532" rx="8" fill="url(#encGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="149" y="86" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="700">1. Text Frontend &amp; FFT Encoder</text>

  <!-- Input Text Box -->
  <rect x="42" y="102" width="214" height="64" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="149" y="121" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Input Token Sequence x [B, L_src]</text>
  <text x="149" y="138" text-anchor="middle" fill="#334155" font-size="10">English: CMUdict + g2p_en (V = 360)</text>
  <text x="149" y="153" text-anchor="middle" fill="#334155" font-size="10">Telugu: NFC Graphemes + @sp (V = 101)</text>

  <line x1="149" y1="166" x2="149" y2="192" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Token + Pos Embedding -->
  <rect x="42" y="194" width="214" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="149" y="216" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="700">Token Emb + Sinusoidal Pos Enc</text>
  <text x="149" y="233" text-anchor="middle" fill="#475569" font-size="10">nn.Embedding(V, 256) + PosEnc(256)</text>

  <line x1="149" y1="246" x2="149" y2="272" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- FFT Encoder Block -->
  <rect x="42" y="274" width="214" height="142" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="149" y="295" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">FFT Encoder (N_e = 4 Blocks)</text>
  <rect x="54" y="305" width="190" height="44" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="149" y="323" text-anchor="middle" fill="#1e293b" font-size="10.5" font-weight="600">Multi-Head Self-Attention</text>
  <text x="149" y="338" text-anchor="middle" fill="#475569" font-size="9.5">h = 2 heads, d_k = 128, Res + LayerNorm</text>
  <rect x="54" y="357" width="190" height="48" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="149" y="375" text-anchor="middle" fill="#1e293b" font-size="10.5" font-weight="600">2-Layer 1D ConvNet FFN</text>
  <text x="149" y="390" text-anchor="middle" fill="#475569" font-size="9.5">k = [9, 1], filter = 1024, ReLU, drop = 0.2</text>

  <line x1="149" y1="416" x2="149" y2="448" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Speaker Embedding Addition (Before VarianceAdaptor per common/model/fastspeech2.py) -->
  <circle cx="149" cy="462" r="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="149" y="467" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">+</text>

  <rect x="42" y="492" width="214" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="149" y="512" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="700">Multi-Speaker Conditioning</text>
  <text x="149" y="529" text-anchor="middle" fill="#334155" font-size="10">speaker_emb: nn.Embedding(N_spk, 256)</text>
  <text x="149" y="544" text-anchor="middle" fill="#475569" font-size="9.5">English Svarah: 115 slots (88 active profiles)</text>
  <text x="149" y="559" text-anchor="middle" fill="#475569" font-size="9.5">Telugu IndicTTS: 2 (spk_000 F, spk_001 M)</text>
  <line x1="149" y1="492" x2="149" y2="477" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Connector Col 1 -> Col 2 -->
  <path d="M 162 462 L 290 462 L 290 135 L 318 135" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="284" y="295" text-anchor="middle" fill="#1e3a8a" font-size="9.2" font-weight="600" transform="rotate(-90 284 295)">H_enc + e_spk [B, L_src, 256]</text>

  <!-- COLUMN 2: EXPLICIT VARIANCE ADAPTOR -->
  <rect x="304" y="64" width="352" height="532" rx="8" fill="url(#vaGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="86" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="700">2. Explicit Variance Adaptor (common/model/variance_adaptor.py)</text>

  <!-- Duration Predictor & Length Regulator -->
  <rect x="320" y="102" width="150" height="74" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="395" y="121" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Duration Predictor</text>
  <text x="395" y="137" text-anchor="middle" fill="#334155" font-size="9.5">2x Conv1D (k=3, d=256)</text>
  <text x="395" y="151" text-anchor="middle" fill="#334155" font-size="9.5">LayerNorm + ReLU + Drop(0.5)</text>
  <text x="395" y="165" text-anchor="middle" fill="#b45309" font-size="9.5" font-weight="600">Out: log_d = ln(d + 1)</text>

  <line x1="470" y1="139" x2="492" y2="139" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="494" y="102" width="146" height="74" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="567" y="121" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Length Regulator</text>
  <text x="567" y="137" text-anchor="middle" fill="#334155" font-size="9.5">Train: MFA Ground-Truth d</text>
  <text x="567" y="151" text-anchor="middle" fill="#334155" font-size="9.5">Infer: round((exp(log_d)-1)*α_d)</text>
  <text x="567" y="165" text-anchor="middle" fill="#0f172a" font-size="9.5" font-weight="600">Expands L_src → L_mel frames</text>

  <!-- Main Frame-Level Spine inside Variance Adaptor -->
  <line x1="567" y1="176" x2="567" y2="278" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="610" y="215" text-anchor="middle" fill="#334155" font-size="9" font-weight="600">H_exp [B, L_mel, 256]</text>

  <!-- Frame-Level Pitch Predictor -->
  <rect x="320" y="232" width="196" height="108" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="418" y="252" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Frame-Level Pitch Predictor</text>
  <text x="418" y="268" text-anchor="middle" fill="#334155" font-size="9.2">2x Conv1D (k=3, d=256, drop=0.5) → Linear(1)</text>
  <text x="418" y="283" text-anchor="middle" fill="#334155" font-size="9.5">Train: GT z_p | Infer: z_p_hat × α_p</text>
  <text x="418" y="298" text-anchor="middle" fill="#334155" font-size="9.5">torch.bucketize (255 linear boundaries)</text>
  <text x="418" y="313" text-anchor="middle" fill="#b45309" font-size="9.2" font-weight="600">pitch_embedding: nn.Embedding(256, 256)</text>
  <text x="418" y="328" text-anchor="middle" fill="#64748b" font-size="9">stats.json: En μ=177.9Hz | Te μ=195.6Hz</text>

  <path d="M 567 210 L 418 210 L 418 230" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrowAmber)"/>
  <circle cx="567" cy="292" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="567" y="297" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">+</text>
  <line x1="516" y1="292" x2="553" y2="292" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <line x1="567" y1="304" x2="567" y2="412" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Frame-Level Energy Predictor -->
  <rect x="320" y="370" width="196" height="108" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="418" y="390" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">Frame-Level Energy Predictor</text>
  <text x="418" y="406" text-anchor="middle" fill="#334155" font-size="9.2">2x Conv1D (k=3, d=256, drop=0.5) → Linear(1)</text>
  <text x="418" y="421" text-anchor="middle" fill="#334155" font-size="9.5">Train: GT z_e | Infer: z_e_hat × α_e</text>
  <text x="418" y="436" text-anchor="middle" fill="#334155" font-size="9.5">torch.bucketize (255 linear boundaries)</text>
  <text x="418" y="451" text-anchor="middle" fill="#b45309" font-size="9.2" font-weight="600">energy_embedding: nn.Embedding(256, 256)</text>
  <text x="418" y="466" text-anchor="middle" fill="#64748b" font-size="9">stats.json: En μ=27.31 | Te μ=28.11 L2</text>

  <path d="M 567 345 L 418 345 L 418 368" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrowAmber)"/>
  <circle cx="567" cy="426" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="567" y="431" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">+</text>
  <line x1="516" y1="426" x2="553" y2="426" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- Variance Losses Box -->
  <rect x="320" y="502" width="320" height="74" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="480" y="521" text-anchor="middle" fill="#92400e" font-size="10.5" font-weight="700">Variance Adaptor Training Objectives (Masked MSE)</text>
  <text x="480" y="538" text-anchor="middle" fill="#334155" font-size="9">L_dur = MSE(log_d_pred, ln(d_gt + 1)) over valid tokens (~src_mask)</text>
  <text x="480" y="553" text-anchor="middle" fill="#334155" font-size="9">L_pitch = MSE(p_pred, z_p_gt) | L_energy = MSE(e_pred, z_e_gt) (~mel_mask)</text>
  <text x="480" y="568" text-anchor="middle" fill="#64748b" font-size="9">Weighting coefficients: λ_dur = 1.0, λ_pitch = 1.0, λ_energy = 1.0</text>

  <!-- Connector Col 2 -> Col 3 -->
  <path d="M 579 426 L 672 426 L 672 145 L 698 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="666" y="295" text-anchor="middle" fill="#334155" font-size="9.2" font-weight="600" transform="rotate(-90 666 295)">H_adapt [B, L_mel, 256]</text>

  <!-- COLUMN 3: FFT DECODER, POSTNET & HIFI-GAN VOCODER -->
  <rect x="684" y="64" width="272" height="532" rx="8" fill="url(#decGrad)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="820" y="86" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">3. Mel Decoder, PostNet &amp; Vocoder</text>

  <!-- FFT Decoder Block -->
  <rect x="700" y="102" width="240" height="128" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="820" y="122" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="700">FFT Decoder (N_d = 6 Blocks)</text>
  <text x="820" y="138" text-anchor="middle" fill="#334155" font-size="9.5">+ Frame Sinusoidal Pos Encoding (256-d)</text>
  <rect x="712" y="146" width="216" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="820" y="162" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">Multi-Head Self-Attention (h=2, d=256)</text>
  <text x="820" y="174" text-anchor="middle" fill="#475569" font-size="9">Dynamic positional expansion for L_mel &gt; 1000</text>
  <rect x="712" y="186" width="216" height="36" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="820" y="202" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">2-Layer Conv1D (k=[9, 1], d_f=1024, drop=0.2)</text>
  <text x="820" y="215" text-anchor="middle" fill="#475569" font-size="9">Residual Connections + LayerNorm</text>

  <line x1="820" y1="230" x2="820" y2="254" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Mel Linear Projection -->
  <rect x="700" y="256" width="240" height="48" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="820" y="275" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Mel Linear Projection (256 → 80)</text>
  <text x="820" y="292" text-anchor="middle" fill="#15803d" font-size="9.5" font-weight="600">Pre-PostNet Mel Y_mel [B, L_mel, 80] (L1 Loss)</text>

  <line x1="820" y1="304" x2="820" y2="328" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Mask-Aware PostNet -->
  <rect x="700" y="330" width="240" height="82" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="820" y="349" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="700">Mask-Aware PostNet (5-Layer Conv1D)</text>
  <text x="820" y="365" text-anchor="middle" fill="#334155" font-size="9.5">4x [Conv1D(k=5, 512ch) + BN + Tanh + Drop(0.5)]</text>
  <text x="820" y="380" text-anchor="middle" fill="#334155" font-size="9.5">1x [Conv1D(k=5, 512→80) + BN] + Mask Zeroing</text>
  <text x="820" y="396" text-anchor="middle" fill="#15803d" font-size="9.5" font-weight="700">Y_post = Y_mel + PostNet(Y_mel) (L1 Loss)</text>

  <line x1="820" y1="412" x2="820" y2="438" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Universal HiFi-GAN Vocoder -->
  <rect x="700" y="440" width="240" height="84" rx="6" fill="url(#vocGrad)" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="820" y="460" text-anchor="middle" fill="#581c87" font-size="11.5" font-weight="700">HiFi-GAN Universal Generator v1</text>
  <text x="820" y="476" text-anchor="middle" fill="#334155" font-size="9.5">Upsample Rates [8, 8, 2, 2] (Hop = 256×)</text>
  <text x="820" y="491" text-anchor="middle" fill="#334155" font-size="9.5">Multi-Receptive Field Fusion (MRF k=[3,7,11])</text>
  <text x="820" y="507" text-anchor="middle" fill="#6b21a8" font-size="9.5" font-weight="600">generator_universal.pth.tar (80-ch, 22,050 Hz)</text>

  <line x1="820" y1="524" x2="820" y2="546" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output Waveform -->
  <rect x="700" y="548" width="240" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="820" y="570" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Synthesized Audio (22,050 Hz, 16-bit PCM)</text>
</svg>